[project]
name = "treepact"
version = "0.1.0"
description = "Local, verifiable change control for coding agents. Evidence before merge."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
    "psutil>=5.9,<7",
    "pathspec>=0.12,<1",
    "platformdirs>=4.2,<5",
]

[project.scripts]
treepact = "treepact.cli.app:run_cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-timeout>=2,<3",
    "pytest-asyncio>=0.23,<1",
    "hypothesis>=6,<7",
    "coverage>=7,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treepact"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "--timeout=300 -q"
timeout_method = "thread"
markers = [
    "eval: evaluation task (EVAL-NNN)",
    "campaign: consolidated campaign stage",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/treepact/cli/*.py" = ["B008"]  # Typer Option() in defaults is idiomatic
"src/treepact/enums.py" = ["UP042"]  # str-Enum mixin is intentional for serialization
"src/treepact/domain/pact.py" = ["UP047"]  # PEP 695 generics deferred (py3.12 typing)
"tests/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
